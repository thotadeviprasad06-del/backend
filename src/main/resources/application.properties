# ===================================================================
# Skill Exchange Platform - Backend Application Configuration
# B.Tech 3rd Year CSE Capstone Project
# ===================================================================

server.port=${PORT:8080}

# Application Name
spring.application.name=skill-exchange-backend

# Default Database: In-Memory Database with MySQL Compatibility Mode
# Allows immediate demonstration without local MySQL server running
spring.datasource.url=jdbc:h2:mem:skill_exchange_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (optional for inspecting database during viva)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
app.jwt.secret=SkillExchangePlatformSecretKeyForBTechCapstone2026FullStackJavaCourseMin256BitsRequired
app.jwt.expiration-ms=86400000

# Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Async Thread Pool Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=SkillExchangeAsync-

# Logging Configuration
logging.level.com.skillexchange=INFO
logging.level.org.springframework.security=WARN
