# ===================================================================
# Skill Exchange Platform - MySQL Production Profile Configuration
# Activate via: --spring.profiles.active=mysql
# ===================================================================

# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/skill_exchange_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
